<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Jack OS Hub</title>
    
    <!-- PWA & Mobile Viewport Headers -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="JackOS" />
    <link rel="apple-touch-icon" href="/src/assets/images/app_icon_pwa_1782653981605.jpg" />
    
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("/sw.js")
            .then((reg) => console.log("Jack OS Service Worker registered successfully:", reg.scope))
            .catch((err) => console.log("Jack OS Service Worker registration failed:", err));
        });
      }
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 selection:bg-cyan-500/30 overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
